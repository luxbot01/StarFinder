# StarFinder's burn-ban watcher: every 6 hours it reads the Texas A&M Forest Service county burn-ban list and, only when
# something changed (or the last check is 12 hours old), commits data/burnbans.json. See tools/burnbans.py and the README.
# No secrets, no personal credential: the job uses the run's own GITHUB_TOKEN with contents: write and nothing else.
name: Burn-ban watcher

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Write and commit the file even if nothing changed"
        type: boolean
        default: false
      accept_drop:
        description: "Accept a list that lost more than half its counties at once"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: burnbans
  cancel-in-progress: false

jobs:
  watch:
    if: github.repository == 'luxbot01/StarFinder'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Tests (a planted county must be found, a clean list must stay clean)
        run: python3 -I tools/test_burnbans.py

      - name: Read the Forest Service list
        env:
          FORCE: ${{ inputs.force }}
          ACCEPT_DROP: ${{ inputs.accept_drop }}
        run: python3 -I tools/burnbans.py

      - name: Commit if the file changed
        run: |
          if git diff --quiet -- data/burnbans.json && [ -z "$(git ls-files --others --exclude-standard -- data/burnbans.json)" ]; then
            echo "data/burnbans.json unchanged, nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/burnbans.json
          git commit -m "Burn bans: refreshed from the Texas A&M Forest Service list"
          git pull --rebase origin main
          git push origin HEAD:main
